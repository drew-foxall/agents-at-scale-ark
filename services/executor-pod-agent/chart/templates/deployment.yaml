apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "executor-pod-agent.fullname" . }}
  labels:
    {{- include "executor-pod-agent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "executor-pod-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "executor-pod-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "executor-pod-agent.serviceAccountName" . }}
      containers:
        - name: executor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
