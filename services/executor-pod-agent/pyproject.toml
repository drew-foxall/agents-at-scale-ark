[project]
name = "executor-pod-agent"
version = "0.1.0"
description = "Pod-based agent executor service for ARK"
authors = [
    {name = "McKinsey Agent Platform Team"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "kubernetes-asyncio>=31.0.0",
    "ark-sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/mckinsey/agents-at-scale-ark"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
executor-pod-agent = "pod_executor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pod_executor"]

[tool.uv.sources]
ark-sdk = { path = "../../out/ark-sdk/py-sdk/dist/ark_sdk-0.1.52-py3-none-any.whl" }
