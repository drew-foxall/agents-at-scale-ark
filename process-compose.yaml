version: "0.5"
is_strict: true
ordered_shutdown: true
environment:
  - AUTH_MODE=${AUTH_MODE:-open}
  - ENABLE_WEBHOOKS=${ENABLE_WEBHOOKS:-false}
  - ARK_BROKER_PORT=${ARK_BROKER_PORT:-8080}
  - ARK_API_PORT=${ARK_API_PORT:-8000}
  - ARK_DASHBOARD_PORT=${ARK_DASHBOARD_PORT:-3000}
  - ARK_CONTROLLER_HEALTH_PORT=${ARK_CONTROLLER_HEALTH_PORT:-8081}
  - PC_PORT_NUM=${PC_PORT_NUM:-9100}
  - KUBECONFIG=${KUBECONFIG:-out/local-kubeconfig}
  - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
  - ARK_API_SERVICE_HOST=${ARK_API_SERVICE_HOST:-localhost}
  - ARK_API_SERVICE_PORT=${ARK_API_SERVICE_PORT:-8000}
  - ARK_API_SERVICE_PROTOCOL=${ARK_API_SERVICE_PROTOCOL:-http}
processes:
  ensure-cluster:
    command: scripts/local/ensure-cluster.sh
    namespace: infra
    availability:
      restart: exit_on_failure
  install-crds:
    command: kubectl apply --validate=false -f ark/config/crd/bases/
    namespace: infra
    depends_on:
      ensure-cluster:
        condition: process_completed_successfully
    availability:
      restart: exit_on_failure
  ark-sdk-build:
    command: bash -c "if ! ls out/ark-sdk/py-sdk/dist/ark_sdk-* >/dev/null 2>&1; then make ark-sdk-clean-stamps; fi && make ark-sdk-build && ls out/ark-sdk/py-sdk/dist/ark_sdk-* >/dev/null 2>&1"
    namespace: core
    availability:
      restart: exit_on_failure
  ark-broker:
    command: bash -c "if [ ! -d node_modules ]; then npm install; fi; npm run dev"
    working_dir: services/ark-broker/ark-broker
    namespace: core
    environment:
      - PORT=${ARK_BROKER_PORT}
      - HOST=0.0.0.0
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: "${ARK_BROKER_PORT}"
        path: /health
      initial_delay_seconds: 2
      period_seconds: 5
    availability:
      restart: always
  ark-controller:
    command: scripts/local/start-ark-controller.sh
    namespace: core
    environment:
      - ENABLE_WEBHOOKS=${ENABLE_WEBHOOKS}
      - KUBECONFIG=${KUBECONFIG}
      - ARK_CONTROLLER_HEALTH_PORT=${ARK_CONTROLLER_HEALTH_PORT:-8081}
    depends_on:
      install-crds:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: "${ARK_CONTROLLER_HEALTH_PORT:-8081}"
        path: /healthz
      initial_delay_seconds: 5
      period_seconds: 5
    availability:
      restart: always
  ark-api:
    command: scripts/local/start-ark-api.sh
    namespace: core
    depends_on:
      install-crds:
        condition: process_completed_successfully
      ark-broker:
        condition: process_healthy
      ark-sdk-build:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: "${ARK_API_PORT}"
        path: /health
      initial_delay_seconds: 30
      period_seconds: 5
    availability:
      restart: always
  ark-dashboard:
    command: bash -c "if [ ! -d node_modules ]; then npm install; fi; npm run dev -- --port $ARK_DASHBOARD_PORT"
    working_dir: services/ark-dashboard/ark-dashboard
    namespace: ui
    environment:
      - PORT=${ARK_DASHBOARD_PORT}
      - ARK_API_SERVICE_HOST=${ARK_API_SERVICE_HOST}
      - ARK_API_SERVICE_PORT=${ARK_API_SERVICE_PORT}
      - ARK_API_SERVICE_PROTOCOL=${ARK_API_SERVICE_PROTOCOL}
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: "${ARK_DASHBOARD_PORT}"
        path: /
      initial_delay_seconds: 10
      period_seconds: 10
    availability:
      restart: always
